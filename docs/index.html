<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Markdown viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<!--
  Viewer for the RISC-ViO specification (risc-vio.md).

  Served over HTTP it loads ./risc-vio.md (or ?src=other.md) on its own.
  Opened from disk, it asks for the file once, because browsers don't let
  local pages read other files. Images resolve relative to this page.

  The Markdown syntax it understands is described at the top of the parser script.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f5;
  --ink: #1a1a1a;
  --muted: #5a5a5a;
  --rule: #1a1a1a;
  --hair: #d2d2d2;
  --tint: rgba(0, 0, 0, .045);
  --isa: #674a93;
  --imp: #2c7a69;
  --isa-swatch: #674a93;
  --imp-swatch: #4aa893;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --measure: 42rem;
  --wide: 64rem;
  --toc-w: 18rem;
  --legend-w: 17rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --ink: #cccccc;
    --muted: #9a9a9a;
    --rule: #757474;
    --hair: #383838;
    --tint: rgba(255, 255, 255, .05);
    --isa: #c6afe9;
    --imp: #a0e6d3;
    --isa-swatch: #c6afe9;
    --imp-swatch: #a0e6d3;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 1.0625rem/1.6 var(--serif);
  font-optical-sizing: auto;
}
:focus-visible { outline: 2px solid var(--isa); outline-offset: 2px; border-radius: 2px; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

/* ---------------------------------------------------------------- chrome */
.textbtn {
  font: inherit; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid var(--hair); border-radius: 3px; padding: .25rem .65rem;
}
.textbtn:hover { border-color: var(--muted); }
.iconbtn {
  display: inline-grid; place-items: center; width: 2rem; height: 2rem; padding: 0;
  border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer;
}
.iconbtn:hover { color: var(--ink); background: var(--tint); }
.iconbtn svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
.flip svg { transform: scaleX(-1); }
.panel-show { position: fixed; top: 1rem; z-index: 5; display: none; }
#toc-show { left: 1rem; }
#legend-show { right: 1rem; }
.panel-head { display: flex; justify-content: flex-end; }
.panel-head .iconbtn { display: none; }

/* ---------------------------------------------------------------- title block */
#titleblock { text-align: center; padding: 3.5rem 1.25rem 0; color: var(--isa); }
.doc-title { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .15em; font-family: var(--mono); font-weight: 400; }
.t-pre, .t-sub { font-size: clamp(1.4rem, 4vw, 1.85rem); font-style: italic; line-height: 1.2; }
.t-title { font-size: clamp(2.6rem, 8vw, 4rem); font-weight: 700; font-style: italic; line-height: 1.05; letter-spacing: -.01em; }
.t-version { margin: 1rem 0 2.75rem; font: italic 500 1.125rem var(--mono); }
.authors {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1.5rem 2rem;
  max-width: 46rem; margin: 0 auto; color: var(--ink); font: .875rem/1.5 var(--mono);
}
.a-name { font-weight: 500; }
.authors em { font-style: italic; color: inherit; }

/* ---------------------------------------------------------------- TOC + legend (inline on narrow screens, like the original) */
#toc-panel, #legend-panel { max-width: var(--measure); margin: 0 auto; padding: 0 1.25rem; }
.panel-title {
  margin: 4rem 0 1.25rem; text-align: center;
  font: 700 2rem/1.2 var(--mono); font-variant: small-caps;
}
#toc, .toc-sub { list-style: none; margin: 0; padding: 0; }
#toc { font-family: var(--mono); }
#toc a { color: inherit; text-decoration: none; display: block; padding: .1rem .4rem; border-radius: 2px; }
#toc a:hover { text-decoration: underline; text-underline-offset: .2em; }
#toc a[aria-current="true"] { box-shadow: inset 2px 0 0 currentColor; background: var(--tint); }
.toc-h1 { margin-top: .45rem; }
.toc-h1 > a { display: grid !important; grid-template-columns: 2.4em 1fr; font-size: .95rem; font-weight: 700; line-height: 1.35; }
.toc-sub { margin-left: 2.4em !important; }
.toc-h2 > a { font-size: .84rem; line-height: 1.35; padding-block: .15rem !important; }
#toc li.isa > a { color: var(--isa); }
#toc li.imp > a { color: var(--imp); }
.panel-foot { margin-top: 1.5rem; font: .8125rem var(--mono); }
#legend { font-size: 1rem; }
#legend p { text-align: justify; hyphens: auto; }
#legend ul { list-style: none; padding: 0; margin: .75rem 0 1rem; }
#legend li { margin: .45rem 0; }
.swatch { font: 700 1.05rem var(--mono); color: var(--ink) !important; display: inline-flex; align-items: center; }
.swatch::before { content: ""; width: 1rem; height: 1rem; margin-right: .85rem; background: var(--isa-swatch); flex: none; }
.swatch.imp::before { background: var(--imp-swatch); }

@media (min-width: 75rem) {
  body { padding-left: var(--toc-w); }
  #toc-panel {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 4; width: var(--toc-w); max-width: none;
    margin: 0; padding: .75rem 1rem 2rem 1rem; overflow-y: auto; scrollbar-width: thin;
    background: var(--bg); border-right: 1px solid var(--hair);
  }
  #toc-panel .panel-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #toc-panel .panel-head .iconbtn { display: inline-grid; }
  body.toc-hidden { padding-left: 0; }
  body.toc-hidden #toc-panel { display: none; }
  body.toc-hidden #toc-show { display: inline-grid; }
}
@media (min-width: 100rem) {
  body:not(.no-legend) { padding-right: var(--legend-w); }
  #legend-panel {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 4; width: var(--legend-w); max-width: none;
    margin: 0; padding: .75rem 1.5rem 2rem 1.25rem; overflow-y: auto; scrollbar-width: thin;
    background: var(--bg); border-left: 1px solid var(--hair);
  }
  #legend-panel .panel-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #legend-panel .panel-head { justify-content: flex-start; }
  #legend-panel .panel-head .iconbtn { display: inline-grid; }
  #legend { font-size: .95rem; }
  #legend p { text-align: left; }
  body.legend-hidden { padding-right: 0; }
  body.legend-hidden #legend-panel { display: none; }
  body.legend-hidden:not(.no-legend) #legend-show { display: inline-grid; }
}
body.no-legend #legend-panel { display: none; }

/* ---------------------------------------------------------------- document */
#doc { max-width: var(--wide); margin: 0 auto; padding: 0 1.25rem 6rem; counter-reset: eq; }
#doc :where(p, ul, ol, h1, h2, h3, h4, h5, h6, blockquote, pre, .note, .legacy, .notes, .inline, .equation, .references, .encoding, .footnotes) {
  max-width: var(--measure); margin-inline: auto;
}
#doc .columns :where(p, ul, ol, h1, h2, h3, h4, h5, h6, blockquote, pre, .note, .table-wrap) { max-width: none; }

#doc p { margin-block: 0 .85em; text-align: justify; hyphens: auto; text-wrap: pretty; }
#doc :is(h1, h2, h3, h4, h5, h6) { font-family: var(--mono); font-weight: 700; line-height: 1.25; scroll-margin-top: 1rem; hyphens: none; text-wrap: balance; }
#doc h1 { font-size: 2rem; font-variant: small-caps; text-align: center; margin-block: 4.5rem 1.4rem; }
#doc h1 .secnum { margin-right: .5em; font-variant: normal; }
#doc h2 { font-size: 1.4rem; font-style: italic; margin-block: 2.4rem .55rem; }
#doc h1 + h2 { margin-top: 1.4rem; }
#doc h3 { font-size: 1.15rem; font-style: italic; margin-block: 1.9rem .45rem; }
#doc h4 { font-size: 1rem; font-style: italic; margin-block: 1.5rem .35rem; }
#doc ul, #doc ol { padding-left: 1.6em; margin-block: 0 1rem; }
#doc li { margin-bottom: .3rem; }
#doc li > p { margin-bottom: .4rem; }
#doc ol > li::marker { font-style: italic; }
#doc em { font-style: italic; }
#doc code, #doc pre { font-family: var(--mono); }
#doc :not(pre) > code { font-size: .88em; background: var(--tint); padding: .05em .3em; border-radius: 2px; }
#doc pre { font-size: .85rem; line-height: 1.6; background: var(--tint); padding: .9rem 1.1rem; overflow-x: auto; margin-block: 0 1.1rem; }
#doc blockquote { border-left: 3px solid var(--hair); margin-block: 0 1rem; padding-left: 1rem; color: var(--muted); }
#doc hr { border: 0; border-top: 1px solid var(--rule); }
#doc sup { line-height: 0; }

/* ISA / implementation colouring (as in the original) */
section.isa :is(h1, h2, h3, h4, h5, h6, em), .isa em, span.isa, em.isa { color: var(--isa); }
section.imp :is(h1, h2, h3, h4, h5, h6, em), .imp em, span.imp, em.imp { color: var(--imp); }

/* links */
#doc a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; }
#doc a.xref { text-decoration: none; }
#doc a.xref::before { content: "["; }
#doc a.xref::after { content: "]"; }
#doc a.xref:hover, #doc a.figref:hover, #doc a.cite:hover { text-decoration: underline; }
#doc a.figref { text-decoration: underline dotted; }
#doc a.cite { text-decoration: none; margin-left: .2em; white-space: nowrap; }
#doc a.broken { text-decoration: underline wavy; text-decoration-color: var(--muted); }

/* figures */
#doc figure { max-width: var(--wide); margin: 2rem auto 2.4rem; text-align: center; }
.fig-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 1.25rem 1rem; }
/* several images share the row and shrink a little before wrapping */
.fig-item { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: min(100%, 11rem); max-width: 100%; }
.fig-row > .fig-item:only-child { flex-basis: 100%; }
.fig-row img { object-fit: contain; }
.subcaption { display: block; margin-top: .55rem; font: .8125rem/1.4 var(--mono); }
#doc figcaption { max-width: var(--measure); margin: .9rem auto 0; font: .8125rem/1.5 var(--mono); text-wrap: balance; }
.fignum { font-weight: 700; margin-right: .4em; }

/* tables */
.table-wrap {
  width: fit-content; min-width: min(100%, var(--measure)); max-width: 100%;
  margin: 1.5rem auto 1.75rem; overflow-x: auto;
}
#doc table { border-collapse: collapse; width: 100%; font: .8125rem/1.45 var(--mono); }
#doc :is(th, td) { border: 1.5px solid var(--rule); padding: .4em .6em; text-align: center; vertical-align: middle; }
#doc th { font-weight: 700; }
/* tables with many columns: smaller type, scroll sideways instead of crushing cells */
#doc table.many-cols { font-size: .75rem; min-width: 60rem; }
#doc table.many-cols :is(th, td) { padding: .35em .45em; }
#doc td.yes { color: var(--isa); }
#doc .imp td.yes { color: var(--imp); }
#doc td.no { color: var(--muted); }

/* bit-field encodings: borderless header, bit numbers at both field edges */
#doc .encoding { max-width: min(100%, 52rem); margin-block: 1.75rem 2rem; }
#doc .encoding .table-wrap { width: 100%; margin: 0; }
#doc .encoding table { table-layout: fixed; min-width: 34rem; }
#doc .encoding thead th { border: 0; padding: .15em .35em; font-weight: 600; line-height: 1.3; vertical-align: bottom; }
#doc .encoding th.bitrange { font-weight: 500; font-size: .75rem; padding-bottom: .3em; }
.bits { display: flex; justify-content: space-between; gap: .5em; }
#doc .encoding td { padding-block: .5em; }

/* columns (two-up on screen, stacked on small screens) */
.columns {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
  gap: 0 2.75rem; max-width: var(--wide); margin: 1rem auto 1.5rem; align-items: start;
}
#doc .columns h2 { text-align: center; }
#doc .columns h4 { font-size: 1.05rem; margin-top: 1.4rem; }
#doc .columns p { text-align: left; }
#doc .columns figure { margin-block: 1.25rem 1.75rem; }
#doc .columns ul { font-size: .95rem; }

/* blocks with meaning */
#doc .note, #doc .note p { font-size: .875rem; color: var(--muted); text-align: left; }
#doc .legacy {
  margin-block: 1.75rem; padding: .1rem 0 .1rem 1.1rem;
  border-left: 2px dashed var(--muted); color: var(--muted);
}
#doc .legacy::before { content: "Legacy"; display: block; margin-bottom: .45rem; font: italic 700 .8125rem var(--mono); }
#doc .inline ul {
  list-style: none; padding: 0; margin-block: .4rem 1.1rem;
  display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem 2rem; font: .9rem var(--mono);
}
#doc .inline li { margin: 0; }
#doc .inline li::before { content: "◈"; margin-right: .45em; opacity: .7; }
#doc .notes ol { list-style: none; padding: 0; font-size: .875rem; counter-reset: note; }
#doc .notes li { counter-increment: note; padding-left: 2.6em; text-indent: -2.6em; margin-bottom: .2rem; }
#doc .notes li::before { content: "*" counter(note) ":"; display: inline-block; width: 2.6em; text-indent: 0; font-style: normal; }
#doc .divider { max-width: var(--wide); margin: 5rem auto 1rem; font: .75rem var(--mono); color: var(--muted); }
#doc .divider p { text-align: center; margin: .4rem 0; max-width: none; }
#doc .divider hr { margin: 0; }
#doc .equation { position: relative; margin-block: 1.25rem; padding: 0 3rem; text-align: center; font-size: 1.1rem; }
#doc .equation::after { content: "(" attr(data-num) ")"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 1rem; }
#doc .references { margin-top: 1rem; }
#doc .footnote { display: flex; gap: .75em; font-size: .9rem; margin-bottom: .5rem; }
#doc .fn-label { flex: none; min-width: 2em; }
#doc .fn-body p { margin: 0; text-align: left; }
#doc .fn-body a { overflow-wrap: anywhere; }
#doc .footnotes { margin-top: 3rem; }

/* file prompt (shown when the page cannot load the Markdown by itself) */
body.awaiting-file :is(#toc-panel, #legend-panel, .panel-show) { display: none !important; }
body.awaiting-file { padding: 0 !important; }
.file-prompt { max-width: 34rem; margin: 18vh auto 4rem; text-align: center; }
#doc .file-prompt p { text-align: center; hyphens: none; }
.file-prompt .prompt-title { font: 700 1.5rem/1.3 var(--mono); color: var(--isa); margin-bottom: 1rem; }
.file-prompt .textbtn { font: 500 .95rem var(--mono); padding: .55rem 1.1rem; margin: .75rem 0 1.5rem; border-color: var(--isa); color: var(--isa); }
.file-prompt .textbtn:hover { background: var(--tint); }
#doc .file-prompt .hint { font-size: .9rem; color: var(--muted); }
#doc .file-prompt code { white-space: nowrap; }

@media (max-width: 40rem) {
  body { font-size: 1rem; }
  #doc p { text-align: left; }
  #doc h1 { font-size: 1.6rem; }
  #doc .equation { padding: 0 2.25rem; }
}

@media print {
  #toc-panel, #legend-panel, .panel-show { display: none !important; }
  body { padding: 0 !important; }
  #doc h1 { break-before: page; }
  #doc :is(figure, .table-wrap, pre, .equation) { break-inside: avoid; }
  #doc :is(h1, h2, h3, h4) { break-after: avoid; }
}
</style>
</head>
<body>
<header id="titleblock" hidden></header>

<nav id="toc-panel" aria-labelledby="toc-title">
  <div class="panel-head">
    <button type="button" class="iconbtn" id="toc-hide" aria-label="Hide table of contents" title="Hide table of contents">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><use href="#icon-menu-open"/></svg>
    </button>
  </div>
  <h2 class="panel-title" id="toc-title">Table of Contents</h2>
  <ol id="toc"></ol>
  <div class="panel-foot"><button type="button" class="textbtn" data-action="choose-file">Open Markdown file…</button></div>
</nav>
<button type="button" class="iconbtn panel-show flip" id="toc-show" aria-label="Show table of contents" title="Show table of contents">
  <svg viewBox="0 -960 960 960" aria-hidden="true"><use href="#icon-menu-open"/></svg>
</button>

<aside id="legend-panel" aria-labelledby="legend-title">
  <div class="panel-head">
    <button type="button" class="iconbtn flip" id="legend-hide" aria-label="Hide legend" title="Hide legend">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><use href="#icon-menu-open"/></svg>
    </button>
  </div>
  <h2 class="panel-title" id="legend-title">Legend</h2>
  <div id="legend"></div>
</aside>
<button type="button" class="iconbtn panel-show" id="legend-show" aria-label="Show legend" title="Show legend">
  <svg viewBox="0 -960 960 960" aria-hidden="true"><use href="#icon-menu-open"/></svg>
</button>

<main id="doc"></main>

<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

<svg hidden aria-hidden="true">
  <symbol id="icon-menu-open" viewBox="0 -960 960 960">
    <path d="M120-240v-80h520v80H120Zm664-40L584-480l200-200 56 56-144 144 144 144-56 56ZM120-440v-80h400v80H120Zm0-200v-80h520v80H120Z"/>
  </symbol>
</svg>

<script>
/* ==========================================================================
   Markdown → HTML

   Standard Markdown (CommonMark) with GitHub tables, plus:
     ---  front matter  ---          title block data (pretitle, title, subtitle, version, lang, authors)
     # Heading {#id}                 explicit anchor; {-} excludes a chapter from numbering
     ::: name   …   :::              fenced div (nestable); `::: {#id .name lang=de}` also works
     | a || b |      | ^^ |          empty cell = merge with the cell to the left, ^^ = merge upwards
     several rows above |---|        all of them become header rows
     ![alt](src "sub"){width=60%}    image size; in figures the title becomes the a)/b) sub-caption
     [text]{.class}                  span with classes
     [^key]  /  [^key]: text         citation / reference entry
     $$ … $$   and   $ … $           maths (TeX subset) rendered as MathML
     *text* → <em> (coloured term)   _text_ → <i> (plain italics)

   Raw HTML is escaped, except comments (dropped) and a few inline tags like <sup>.
   ========================================================================== */
const Markdown = (() => {
  'use strict';

  /* ------------------------------------------------------------------ helpers */

  const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  const ASCII_PUNCTUATION = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';
  const UNICODE_PUNCTUATION = /[\p{P}\p{S}]/u;
  const ALLOWED_INLINE_TAGS = 'sup|sub|br|u|kbd|mark|small|s|del|ins|var|samp|b|i|em|strong|q|code';
  // attributes that `{key=value}` may copy onto an element
  const ALLOWED_ATTRIBUTE = /^(lang|dir|title|data-[\w-]+)$/;

  const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (char) => HTML_ESCAPES[char]);
  const isBlankLine = (line) => /^\s*$/.test(line);
  const countLeadingSpaces = (line) => line.match(/^ */)[0].length;
  const normalizeLabel = (label) => label.trim().toLowerCase().replace(/\s+/g, ' ');

  function slugify(text) {
    const slug = text.toLowerCase()
      .replace(/<[^>]*>/g, '')
      .replace(/[^\p{L}\p{N}\s_-]/gu, '')
      .trim()
      .replace(/\s+/g, '-');
    return slug || 'section';
  }

  /** Parses `#id .class key=value` (the inside of `{…}`). */
  function parseAttributes(text) {
    const attributes = { id: null, classes: [], extra: {} };
    const pattern = /([#.])([\w:-]+)|([\w-]+)=("([^"]*)"|'([^']*)'|[^\s}]+)|(-)(?=\s|$)/g;
    for (const match of text.matchAll(pattern)) {
      const [, sigil, name, key, rawValue, doubleQuoted, singleQuoted, unnumbered] = match;
      if (sigil === '#') attributes.id = name;
      else if (sigil === '.') attributes.classes.push(name);
      else if (key) attributes.extra[key] = doubleQuoted ?? singleQuoted ?? rawValue;
      else if (unnumbered) attributes.classes.push('unnumbered');
    }
    return attributes;
  }

  const emptyAttributes = () => ({ id: null, classes: [], extra: {} });

  function attributesToHtml(attributes, extraClasses = []) {
    let html = '';
    if (attributes.id) html += ` id="${escapeHtml(attributes.id)}"`;
    const classes = [...extraClasses, ...attributes.classes];
    if (classes.length) html += ` class="${escapeHtml(classes.join(' '))}"`;
    for (const [key, value] of Object.entries(attributes.extra)) {
      if (ALLOWED_ATTRIBUTE.test(key)) html += ` ${key}="${escapeHtml(value)}"`;
    }
    return html;
  }

  /** Blocks script URLs and resolves relative URLs against the Markdown file. */
  function sanitizeUrl(url, baseUrl) {
    url = url.trim();
    const isScript = /^(javascript|vbscript|data):/i.test(url) && !/^data:image\//i.test(url);
    if (isScript) return '#';
    if (url.startsWith('#') || !baseUrl) return url;
    try { return new URL(url, baseUrl).href; } catch { return url; }
  }

  /* ------------------------------------------------------------------ front matter (YAML subset) */

  function splitFrontMatter(source) {
    const match = source.match(/^---[ \t]*\n([\s\S]*?)\n(?:---|\.\.\.)[ \t]*(?:\n|$)/);
    if (!match) return { meta: {}, body: source };
    return { meta: parseYamlSubset(match[1]), body: source.slice(match[0].length) };
  }

  function parseYamlScalar(value) {
    value = value.trim();
    if (/^".*"$/.test(value)) { try { return JSON.parse(value); } catch { return value.slice(1, -1); } }
    if (/^'.*'$/.test(value)) return value.slice(1, -1).replace(/''/g, "'");
    return value;
  }

  /** Supports `key: value` and lists of scalars or of `key: value` maps. */
  function parseYamlSubset(text) {
    const result = {};
    const lines = text.split('\n');
    let index = 0;
    while (index < lines.length) {
      const entry = lines[index++].match(/^([\w-]+):\s*(.*)$/);
      if (!entry) continue;
      const [, key, value] = entry;
      if (value.trim() !== '') { result[key] = parseYamlScalar(value); continue; }

      const list = [];
      while (index < lines.length && (/^\s/.test(lines[index]) || isBlankLine(lines[index]))) {
        const item = lines[index++].match(/^(\s*)-\s+(.*)$/);
        if (!item) continue;
        const firstPair = item[2].match(/^([\w-]+):\s*(.*)$/);
        if (!firstPair) { list.push(parseYamlScalar(item[2])); continue; }

        const map = { [firstPair[1]]: parseYamlScalar(firstPair[2]) };
        const pairIndent = item[1].length + 2;
        let pair;
        while (index < lines.length
          && (pair = lines[index].match(/^(\s+)([\w-]+):\s*(.*)$/))
          && pair[1].length >= pairIndent) {
          map[pair[2]] = parseYamlScalar(pair[3]);
          index++;
        }
        list.push(map);
      }
      result[key] = list;
    }
    return result;
  }

  /* ------------------------------------------------------------------ block parsing */

  const BLOCK = {
    divOpening: /^ {0,3}(:{3,})[ \t]*([^:\s].*?)[ \t]*:*[ \t]*$/,
    divClosing: /^ {0,3}:{3,}[ \t]*$/,
    codeFence: /^( {0,3})(`{3,}|~{3,})[ \t]*([^`\s]*)[^`]*$/,
    codeFenceClosing: /^ {0,3}(`{3,}|~{3,})[ \t]*$/,
    displayMath: /^ {0,3}\$\$(.*)$/,
    atxHeading: /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?[ \t]*$/,
    setextUnderline: /^ {0,3}(=+|-+)[ \t]*$/,
    thematicBreak: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/,
    blockquote: /^ {0,3}>/,
    listItem: /^( {0,3})([-+*]|\d{1,9}[.)])([ \t]+|$)/,
    htmlComment: /^ {0,3}<!--/,
    footnoteDefinition: /^ {0,3}\[\^([^\]\s]+)\]:[ \t]?(.*)$/,
    linkDefinition: /^ {0,3}\[([^\]^][^\]]*)\]:[ \t]*<?([^\s>]+)>?(?:[ \t]+(?:"([^"]*)"|'([^']*)'|\(([^)]*)\)))?[ \t]*$/,
    tableDelimiterRow: /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/,
  };

  function parseBlocks(lines, context) {
    const blocks = [];
    let index = 0;
    while (index < lines.length) {
      if (isBlankLine(lines[index])) { index++; continue; }
      const { node, next } = readBlock(lines, index, context);
      if (node) blocks.push(node);
      index = next;
    }
    return blocks;
  }

  // Each reader returns { node, next } (node may be null for dropped content) or null if
  // the line does not start that kind of block. Anything else becomes a paragraph.
  const BLOCK_READERS = [
    readHtmlComment, readFencedDiv, readStrayDivClosing, readFencedCode, readDisplayMath,
    readAtxHeading, readThematicBreak, readBlockquote, readFootnoteDefinition,
    readLinkDefinition, readList, readTable,
  ];

  function readBlock(lines, index, context) {
    for (const reader of BLOCK_READERS) {
      const result = reader(lines, index, context);
      if (result) return result;
    }
    return readParagraph(lines, index);
  }

  /** Whether a line starts a block that ends a running paragraph. */
  function interruptsParagraph(line) {
    const startsBlock = [
      BLOCK.atxHeading, BLOCK.codeFence, BLOCK.divOpening, BLOCK.divClosing, BLOCK.displayMath,
      BLOCK.thematicBreak, BLOCK.blockquote, BLOCK.htmlComment,
    ].some((pattern) => pattern.test(line));
    if (startsBlock) return true;
    const item = line.match(BLOCK.listItem);
    return Boolean(item && item[3] && (/[-+*]/.test(item[2]) || /^1[.)]$/.test(item[2])));
  }

  function readHtmlComment(lines, index) {
    if (!BLOCK.htmlComment.test(lines[index])) return null;
    let end = index;
    while (end < lines.length && !lines[end].includes('-->')) end++;
    return { node: null, next: end + 1 };
  }

  function readFencedDiv(lines, index, context) {
    const opening = lines[index].match(BLOCK.divOpening);
    if (!opening) return null;

    // collect lines up to the matching closing fence (ignoring fences inside code blocks)
    const bodyLines = [];
    let depth = 1;
    let openCodeFence = null;
    let end = index + 1;
    for (; end < lines.length; end++) {
      const line = lines[end];
      const fence = line.match(BLOCK.codeFence);
      if (openCodeFence) {
        const closing = line.match(BLOCK.codeFenceClosing);
        if (closing && closing[1][0] === openCodeFence[0] && closing[1].length >= openCodeFence.length) openCodeFence = null;
      } else if (fence) {
        openCodeFence = fence[2];
      } else if (BLOCK.divClosing.test(line)) {
        if (--depth === 0) break;
      } else if (BLOCK.divOpening.test(line)) {
        depth++;
      }
      bodyLines.push(line);
    }

    const spec = opening[2].trim();
    let attributes;
    if (spec.startsWith('{')) {
      attributes = parseAttributes(spec);
    } else {
      const [name, ...rest] = spec.split(/\s+/);
      attributes = parseAttributes(rest.join(' '));
      attributes.classes.unshift(name);
    }
    return { node: { type: 'div', attributes, children: parseBlocks(bodyLines, context) }, next: end + 1 };
  }

  function readStrayDivClosing(lines, index) {
    return BLOCK.divClosing.test(lines[index]) ? { node: null, next: index + 1 } : null;
  }

  function readFencedCode(lines, index) {
    const opening = lines[index].match(BLOCK.codeFence);
    if (!opening) return null;
    const [, indent, fence, language] = opening;
    const removeIndent = new RegExp(`^ {0,${indent.length}}`);
    const codeLines = [];
    let end = index + 1;
    for (; end < lines.length; end++) {
      const closing = lines[end].match(BLOCK.codeFenceClosing);
      if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length) break;
      codeLines.push(lines[end].replace(removeIndent, ''));
    }
    return { node: { type: 'code', language, text: codeLines.join('\n') }, next: end + 1 };
  }

  function readDisplayMath(lines, index) {
    const opening = lines[index].match(BLOCK.displayMath);
    if (!opening) return null;
    const oneLiner = opening[1].match(/^(.*?)\$\$[ \t]*$/);
    if (oneLiner) return { node: { type: 'math', tex: oneLiner[1] }, next: index + 1 };

    const texLines = opening[1].trim() ? [opening[1]] : [];
    let end = index + 1;
    for (; end < lines.length && !/\$\$[ \t]*$/.test(lines[end]); end++) texLines.push(lines[end]);
    if (end < lines.length) texLines.push(lines[end].replace(/\$\$[ \t]*$/, ''));
    return { node: { type: 'math', tex: texLines.join('\n') }, next: end + 1 };
  }

  function readAtxHeading(lines, index) {
    const match = lines[index].match(BLOCK.atxHeading);
    if (!match) return null;
    let text = (match[2] || '').replace(/(^|[ \t]+)#+$/, '');
    let attributes = emptyAttributes();
    const trailingBraces = text.match(/^(.*?)[ \t]*\{([^{}]*)\}$/);
    const looksLikeAttributes = trailingBraces && /^\s*([#.]|-\s*$|[\w-]+=)/.test(trailingBraces[2]);
    if (looksLikeAttributes) {
      text = trailingBraces[1];
      attributes = parseAttributes(trailingBraces[2]);
    }
    return { node: { type: 'heading', level: match[1].length, text, attributes }, next: index + 1 };
  }

  function readThematicBreak(lines, index) {
    return BLOCK.thematicBreak.test(lines[index]) ? { node: { type: 'thematicBreak' }, next: index + 1 } : null;
  }

  function readBlockquote(lines, index, context) {
    if (!BLOCK.blockquote.test(lines[index])) return null;
    const quoteLines = [];
    let end = index;
    for (; end < lines.length && !isBlankLine(lines[end]); end++) {
      const line = lines[end];
      if (BLOCK.blockquote.test(line)) quoteLines.push(line.replace(/^ {0,3}> ?/, ''));
      else if (!interruptsParagraph(line)) quoteLines.push(line); // lazy continuation
      else break;
    }
    return { node: { type: 'blockquote', children: parseBlocks(quoteLines, context) }, next: end };
  }

  function readFootnoteDefinition(lines, index, context) {
    const match = lines[index].match(BLOCK.footnoteDefinition);
    if (!match) return null;
    const isIndented = (line) => /^( {2,}|\t)/.test(line);
    const bodyLines = [match[2]];
    let end = index + 1;
    while (end < lines.length) {
      const line = lines[end];
      const previous = bodyLines[bodyLines.length - 1];
      if (isIndented(line)) {
        bodyLines.push(line.replace(/^( {1,4}|\t)/, ''));
      } else if (isBlankLine(line) && end + 1 < lines.length && isIndented(lines[end + 1])) {
        bodyLines.push('');
      } else if (!isBlankLine(line) && !isBlankLine(previous) && !interruptsParagraph(line) && !BLOCK.footnoteDefinition.test(line)) {
        bodyLines.push(line); // lazy continuation
      } else {
        break;
      }
      end++;
    }
    return { node: { type: 'footnoteDefinition', key: match[1], children: parseBlocks(bodyLines, context) }, next: end };
  }

  function readLinkDefinition(lines, index, context) {
    const match = lines[index].match(BLOCK.linkDefinition);
    if (!match) return null;
    const label = normalizeLabel(match[1]);
    if (!context.linkDefinitions[label]) {
      context.linkDefinitions[label] = { href: match[2], title: match[3] ?? match[4] ?? match[5] ?? null };
    }
    return { node: null, next: index + 1 };
  }

  function readList(lines, index, context) {
    const first = lines[index].match(BLOCK.listItem);
    if (!first || BLOCK.thematicBreak.test(lines[index])) return null;

    const ordered = /\d/.test(first[2]);
    const marker = ordered ? first[2].slice(-1) : first[2];
    const belongsToList = (item) => (ordered ? /\d/.test(item[2]) && item[2].slice(-1) === marker : item[2] === marker);

    const items = [];
    let loose = false;
    let position = index;
    while (position < lines.length) {
      const item = lines[position].match(BLOCK.listItem);
      if (!item || BLOCK.thematicBreak.test(lines[position]) || !belongsToList(item)) break;

      const { itemLines, next } = collectListItemLines(lines, position, item);
      position = next;

      let trailingBlankLines = 0;
      while (itemLines.length && isBlankLine(itemLines[itemLines.length - 1])) { itemLines.pop(); trailingBlankLines++; }
      if (itemLines.some(isBlankLine)) loose = true;
      items.push({ children: parseBlocks(itemLines, context) });

      if (trailingBlankLines) {
        // a blank line between items makes the list loose; anything else ends it
        const nextItem = position < lines.length ? lines[position].match(BLOCK.listItem) : null;
        if (nextItem && belongsToList(nextItem) && !BLOCK.thematicBreak.test(lines[position])) loose = true;
        else break;
      }
    }
    const start = ordered ? parseInt(first[2], 10) : 1;
    return { node: { type: 'list', ordered, start, items, loose }, next: position };
  }

  function collectListItemLines(lines, index, item) {
    const [whole, indent, marker, spacing] = item;
    const usesMinimalIndent = spacing.length >= 5 || spacing.length === 0;
    const contentIndent = indent.length + marker.length + (usesMinimalIndent ? 1 : spacing.length);
    const firstLine = usesMinimalIndent
      ? lines[index].slice(indent.length + marker.length + 1)
      : lines[index].slice(whole.length);

    const itemLines = [firstLine];
    let position = index + 1;
    let afterBlankLine = false;
    for (; position < lines.length; position++) {
      const line = lines[position];
      if (isBlankLine(line)) { itemLines.push(''); afterBlankLine = true; continue; }
      if (countLeadingSpaces(line) >= contentIndent) {
        itemLines.push(line.slice(contentIndent));
        afterBlankLine = false;
        continue;
      }
      if (afterBlankLine || BLOCK.listItem.test(line) || interruptsParagraph(line)) break;
      itemLines.push(line); // lazy continuation
    }
    return { itemLines, next: position };
  }

  function readTable(lines, index) {
    if (!lines[index].includes('|')) return null;

    // one or more header rows, then the |---| delimiter row
    let delimiterIndex = -1;
    for (let i = index + 1; i < lines.length && lines[i].includes('|') && !isBlankLine(lines[i]); i++) {
      if (BLOCK.tableDelimiterRow.test(lines[i]) && lines[i].includes('-')) { delimiterIndex = i; break; }
    }
    if (delimiterIndex < 0) return null;

    let end = delimiterIndex + 1;
    while (end < lines.length && !isBlankLine(lines[end]) && lines[end].includes('|') && !interruptsParagraph(lines[end])) end++;

    const alignments = splitTableRow(lines[delimiterIndex]).map((cell) => {
      cell = cell.trim();
      if (cell.startsWith(':') && cell.endsWith(':')) return 'center';
      if (cell.endsWith(':')) return 'right';
      if (cell.startsWith(':')) return 'left';
      return null;
    });
    return {
      node: {
        type: 'table',
        alignments,
        headerRows: lines.slice(index, delimiterIndex).map(splitTableRow),
        bodyRows: lines.slice(delimiterIndex + 1, end).map(splitTableRow),
      },
      next: end,
    };
  }

  /** Splits a table row on unescaped pipes. Empty strings (`||`) are kept: they mark merged cells. */
  function splitTableRow(line) {
    let row = line.trim();
    if (row.startsWith('|')) row = row.slice(1);
    if (row.endsWith('|') && !row.endsWith('\\|')) row = row.slice(0, -1);
    const cells = [];
    let cell = '';
    for (let i = 0; i < row.length; i++) {
      if (row[i] === '\\' && row[i + 1] === '|') { cell += '\\|'; i++; continue; }
      if (row[i] === '|') { cells.push(cell); cell = ''; continue; }
      cell += row[i];
    }
    cells.push(cell);
    return cells;
  }

  function readParagraph(lines, index) {
    const paragraphLines = [lines[index]];
    let end = index + 1;
    let setextLevel = null;
    for (; end < lines.length; end++) {
      const line = lines[end];
      if (isBlankLine(line)) break;
      const underline = line.match(BLOCK.setextUnderline);
      if (underline) { setextLevel = underline[1][0] === '=' ? 1 : 2; end++; break; }
      if (interruptsParagraph(line)) break;
      paragraphLines.push(line);
    }
    const text = paragraphLines.join('\n').replace(/^[ \t]+/gm, '');
    const node = setextLevel
      ? { type: 'heading', level: setextLevel, text: text.trim(), attributes: emptyAttributes() }
      : { type: 'paragraph', text: text.replace(/[ \t]+$/, '') };
    return { node, next: end };
  }

  /* ------------------------------------------------------------------ inline parsing */

  const PLAIN_TEXT_RUN = /^[^\\`<&!\[*_~$\n]+/;

  // Each reader gets (text, position, context) and returns
  //   { html, end }        finished HTML,
  //   { delimiter, end }   an emphasis delimiter run, resolved later, or
  //   null                 the character is literal text.
  const INLINE_READERS = {
    '\\': readBackslash,
    '`': readCodeSpan,
    '<': readAngleBracket,
    '&': readEntity,
    '!': readImage,
    '[': readLinkSpanOrCitation,
    '$': readInlineMath,
    '\n': readLineBreak,
    '*': readDelimiterRun,
    '_': readDelimiterRun,
    '~': readDelimiterRun,
  };

  function renderInline(text, context) {
    const tokens = tokenizeInline(text, context);
    resolveEmphasis(tokens);
    return tokens.map((token) => (token.type === 'html' ? token.html : delimiterToHtml(token))).join('');
  }

  function tokenizeInline(text, context) {
    const tokens = [];
    let pendingText = '';
    const flushText = () => {
      if (pendingText) tokens.push({ type: 'html', html: pendingText });
      pendingText = '';
    };

    let position = 0;
    while (position < text.length) {
      const plain = text.slice(position).match(PLAIN_TEXT_RUN);
      if (plain) {
        pendingText += escapeHtml(plain[0]);
        position += plain[0].length;
        continue;
      }
      const reader = INLINE_READERS[text[position]];
      const result = reader ? reader(text, position, context) : null;
      if (!result) {
        pendingText += escapeHtml(text[position]);
        position++;
        continue;
      }
      if (result.isLineBreak) pendingText = pendingText.replace(/ +$/, '');
      if (result.delimiter) {
        flushText();
        tokens.push(result.delimiter);
      } else {
        pendingText += result.html;
      }
      position = result.end;
      if (result.isLineBreak) while (text[position] === ' ') position++;
    }
    flushText();
    return tokens;
  }

  function readBackslash(text, position) {
    const next = text[position + 1];
    if (next === '\n') return { html: '<br>\n', end: position + 2, isLineBreak: true };
    if (next && ASCII_PUNCTUATION.includes(next)) return { html: escapeHtml(next), end: position + 2 };
    return null;
  }

  function readLineBreak(text, position) {
    const isHardBreak = / {2,}$/.test(text.slice(0, position));
    return { html: isHardBreak ? '<br>\n' : '\n', end: position + 1, isLineBreak: true };
  }

  function readCodeSpan(text, position) {
    let openingEnd = position;
    while (text[openingEnd] === '`') openingEnd++;
    const fenceLength = openingEnd - position;

    // the closing run must have exactly the same number of backticks
    let search = openingEnd;
    while ((search = text.indexOf('`', search)) !== -1) {
      let runEnd = search;
      while (text[runEnd] === '`') runEnd++;
      if (runEnd - search === fenceLength) {
        let code = text.slice(openingEnd, search).replace(/\n/g, ' ');
        if (/^ .*[^ ].* $/.test(code)) code = code.slice(1, -1);
        return { html: `<code>${escapeHtml(code)}</code>`, end: runEnd };
      }
      search = runEnd;
    }
    return { html: '`'.repeat(fenceLength), end: openingEnd };
  }

  function readAngleBracket(text, position) {
    const rest = text.slice(position);
    if (rest.startsWith('<!--')) {
      const commentEnd = text.indexOf('-->', position + 4);
      if (commentEnd >= 0) return { html: '', end: commentEnd + 3 };
    }
    const urlAutolink = rest.match(/^<([a-zA-Z][a-zA-Z0-9+.-]{1,31}:[^\s<>]*)>/);
    if (urlAutolink) {
      const url = urlAutolink[1];
      return { html: `<a href="${escapeHtml(sanitizeUrl(url))}">${escapeHtml(url)}</a>`, end: position + urlAutolink[0].length };
    }
    const emailAutolink = rest.match(/^<([^\s@<>\\]+@[^\s@<>\\]+\.[^\s@<>\\]+)>/);
    if (emailAutolink) {
      const email = escapeHtml(emailAutolink[1]);
      return { html: `<a href="mailto:${email}">${email}</a>`, end: position + emailAutolink[0].length };
    }
    const allowedTag = rest.match(new RegExp(`^<(/?)(${ALLOWED_INLINE_TAGS})\\s*/?>`, 'i'));
    if (allowedTag) {
      return { html: `<${allowedTag[1]}${allowedTag[2].toLowerCase()}>`, end: position + allowedTag[0].length };
    }
    return null; // escaped as &lt;
  }

  function readEntity(text, position) {
    const entity = text.slice(position).match(/^&(#\d{1,7}|#[xX][\da-fA-F]{1,6}|[a-zA-Z][a-zA-Z\d]{1,31});/);
    return entity ? { html: entity[0], end: position + entity[0].length } : null;
  }

  function readInlineMath(text, position) {
    const math = text.slice(position).match(/^\$(?!\s)((?:\\.|[^$\\\n])+?)(?<!\s)\$(?!\d)/);
    return math ? { html: texToMathML(math[1], false), end: position + math[0].length } : null;
  }

  /** `*`, `_` and `~~` runs. Whether they can open or close follows the CommonMark flanking rules. */
  function readDelimiterRun(text, position) {
    const char = text[position];
    if (char === '~' && text[position + 1] !== '~') return null;
    let end = position;
    while (text[end] === char) end++;

    const before = position > 0 ? text[position - 1] : ' ';
    const after = end < text.length ? text[end] : ' ';
    const spaceBefore = /\s/.test(before);
    const spaceAfter = /\s/.test(after);
    const punctuationBefore = UNICODE_PUNCTUATION.test(before);
    const punctuationAfter = UNICODE_PUNCTUATION.test(after);
    const leftFlanking = !spaceAfter && (!punctuationAfter || spaceBefore || punctuationBefore);
    const rightFlanking = !spaceBefore && (!punctuationBefore || spaceAfter || punctuationAfter);

    let canOpen = leftFlanking;
    let canClose = rightFlanking;
    if (char === '_') { // no intraword emphasis with underscores (object_size)
      canOpen = leftFlanking && (!rightFlanking || punctuationBefore);
      canClose = rightFlanking && (!leftFlanking || punctuationAfter);
    }
    const delimiter = {
      type: 'delimiter', char, count: end - position, originalCount: end - position,
      canOpen, canClose, openTags: [], closeTags: [],
    };
    return { delimiter, end };
  }

  /** Pairs delimiter runs into <em>/<i>/<strong>/<del> (CommonMark "process emphasis"). */
  function resolveEmphasis(tokens) {
    for (let closerIndex = 0; closerIndex < tokens.length; closerIndex++) {
      const closer = tokens[closerIndex];
      if (closer.type !== 'delimiter' || !closer.canClose || closer.count === 0) continue;

      const openerIndex = findOpener(tokens, closerIndex);
      if (openerIndex < 0) continue;
      const opener = tokens[openerIndex];

      const used = closer.char === '~' || (opener.count >= 2 && closer.count >= 2) ? 2 : 1;
      let tag = closer.char === '_' ? 'i' : 'em';
      if (used === 2) tag = closer.char === '~' ? 'del' : 'strong';
      opener.count -= used;
      closer.count -= used;
      opener.openTags.push(tag);
      closer.closeTags.push(tag);

      // delimiters between a matched pair can no longer match anything
      for (let i = openerIndex + 1; i < closerIndex; i++) {
        if (tokens[i].type === 'delimiter') { tokens[i].canOpen = false; tokens[i].canClose = false; }
      }
      if (closer.count > 0) closerIndex--; // the rest of this run may close another opener
    }
  }

  function findOpener(tokens, closerIndex) {
    const closer = tokens[closerIndex];
    for (let i = closerIndex - 1; i >= 0; i--) {
      const opener = tokens[i];
      if (opener.type !== 'delimiter' || opener.char !== closer.char || !opener.canOpen || opener.count === 0) continue;
      if (closer.char === '~') {
        if (opener.count === 2 && closer.count === 2) return i;
        continue;
      }
      // "rule of three": e.g. in *foo**bar* the ** neither opens nor closes
      const bothCanSwitch = opener.canClose || closer.canOpen;
      const sumIsMultipleOfThree = (opener.originalCount + closer.originalCount) % 3 === 0;
      const bothAreMultiplesOfThree = opener.originalCount % 3 === 0 && closer.originalCount % 3 === 0;
      if (bothCanSwitch && sumIsMultipleOfThree && !bothAreMultiplesOfThree) continue;
      return i;
    }
    return -1;
  }

  /** A run may close earlier tags and open later ones; unused characters stay literal. */
  function delimiterToHtml(token) {
    const closing = token.closeTags.map((tag) => `</${tag}>`).join('');
    const opening = [...token.openTags].reverse().map((tag) => `<${tag}>`).join('');
    return closing + escapeHtml(token.char.repeat(token.count)) + opening;
  }

  /* --- links, images, spans and citations */

  function readImage(text, position, context) {
    return text[position + 1] === '[' ? readBracketed(text, position + 1, true, context) : null;
  }

  function readLinkSpanOrCitation(text, position, context) {
    return readBracketed(text, position, false, context);
  }

  function readBracketed(text, openIndex, isImage, context) {
    const closeIndex = findClosingBracket(text, openIndex);
    if (closeIndex < 0) return null;
    const label = text.slice(openIndex + 1, closeIndex);
    let position = closeIndex + 1;

    if (!isImage && /^\^[^\]\s]+$/.test(label)) {
      return { html: context.citation(label.slice(1)), end: position };
    }

    let target = null;
    if (text[position] === '(') {
      target = readLinkDestination(text, position);
      if (target) position = target.end;
    }
    if (!target && !isImage && text[position] === '{') {
      const span = readAttributeBlock(text, position);
      if (span) {
        return { html: `<span${attributesToHtml(span.attributes)}>${renderInline(label, context)}</span>`, end: span.end };
      }
    }
    if (!target) {
      // reference links: [text][label], [text][] and [text]
      let referenceLabel = label;
      const explicit = text.slice(position).match(/^\[([^\]]*)\]/);
      if (explicit) referenceLabel = explicit[1] || label;
      const definition = context.linkDefinitions[normalizeLabel(referenceLabel)];
      if (!definition) return null;
      target = { href: definition.href, title: definition.title };
      if (explicit) position += explicit[0].length;
    }

    const attributeBlock = readAttributeBlock(text, position);
    const attributes = attributeBlock ? attributeBlock.attributes : emptyAttributes();
    if (attributeBlock) position = attributeBlock.end;

    const html = isImage
      ? imageHtml(label, target, attributes, context)
      : linkHtml(label, target, attributes, context);
    return { html, end: position };
  }

  function imageHtml(label, { href, title }, attributes, context) {
    let style = '';
    if (attributes.extra.width) style += `width:${attributes.extra.width};`;
    if (attributes.extra.height) style += `height:${attributes.extra.height};`;
    delete attributes.extra.width;
    delete attributes.extra.height;
    return `<img src="${escapeHtml(sanitizeUrl(href, context.baseUrl))}" alt="${escapeHtml(plainText(label))}"`
      + (title ? ` title="${escapeHtml(title)}"` : '')
      + (style ? ` style="${escapeHtml(style)}"` : '')
      + `${attributesToHtml(attributes)} decoding="async">`;
  }

  function linkHtml(label, { href, title }, attributes, context) {
    const isInternal = href.startsWith('#');
    const url = isInternal ? href : sanitizeUrl(href, context.baseUrl);
    const isExternal = !isInternal && /^[a-z]+:/i.test(href);
    return `<a href="${escapeHtml(url)}"`
      + (title ? ` title="${escapeHtml(title)}"` : '')
      + attributesToHtml(attributes)
      + (isExternal ? ' rel="noopener"' : '')
      + `>${renderInline(label, context)}</a>`;
  }

  /** Index of the `]` matching the `[` at openIndex, skipping escapes and code spans. */
  function findClosingBracket(text, openIndex) {
    let depth = 0;
    for (let i = openIndex; i < text.length; i++) {
      const char = text[i];
      if (char === '\\') { i++; continue; }
      if (char === '`') {
        let runEnd = i;
        while (text[runEnd] === '`') runEnd++;
        const codeEnd = text.indexOf('`'.repeat(runEnd - i), runEnd);
        i = codeEnd > 0 ? codeEnd + (runEnd - i) - 1 : runEnd - 1;
        continue;
      }
      if (char === '[') depth++;
      else if (char === ']' && --depth === 0) return i;
    }
    return -1;
  }

  /** Reads `(url "title")` starting at the opening parenthesis. */
  function readLinkDestination(text, openParen) {
    const skipWhitespace = (i) => { while (/[ \t\n]/.test(text[i] || '')) i++; return i; };
    let position = skipWhitespace(openParen + 1);

    let href = '';
    if (text[position] === '<') {
      const close = text.indexOf('>', position);
      if (close < 0) return null;
      href = text.slice(position + 1, close);
      position = close + 1;
    } else {
      let parenDepth = 0;
      for (; position < text.length; position++) {
        const char = text[position];
        if (char === '\\' && ASCII_PUNCTUATION.includes(text[position + 1])) { href += text[++position]; continue; }
        if (/\s/.test(char)) break;
        if (char === '(') parenDepth++;
        if (char === ')') { if (parenDepth === 0) break; parenDepth--; }
        href += char;
      }
    }

    position = skipWhitespace(position);
    let title = null;
    const quote = text[position];
    if (quote === '"' || quote === "'" || quote === '(') {
      const closingQuote = quote === '(' ? ')' : quote;
      let close = position + 1;
      while (close < text.length && text[close] !== closingQuote) close += text[close] === '\\' ? 2 : 1;
      if (close >= text.length) return null;
      title = text.slice(position + 1, close).replace(/\\(.)/g, '$1');
      position = skipWhitespace(close + 1);
    }
    if (text[position] !== ')') return null;
    return { href, title, end: position + 1 };
  }

  /** Reads `{#id .class key=value}` directly at position. */
  function readAttributeBlock(text, position) {
    if (text[position] !== '{') return null;
    const close = text.indexOf('}', position);
    if (close < 0) return null;
    const body = text.slice(position + 1, close);
    if (!/^\s*([#.]|[\w-]+=)/.test(body)) return null;
    return { attributes: parseAttributes(body), end: close + 1 };
  }

  /** Markdown label → plain text (for alt attributes). */
  function plainText(markdown) {
    return markdown
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/\[([^\]]*)\][({][^)}]*[)}]/g, '$1')
      .replace(/[*_`~]/g, '')
      .replace(/\\(.)/g, '$1');
  }

  /* ------------------------------------------------------------------ maths: TeX subset → MathML */

  const TEX_IDENTIFIERS = {
    alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ',
    iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', rho: 'ρ', sigma: 'σ',
    tau: 'τ', phi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω', Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ',
    Lambda: 'Λ', Pi: 'Π', Sigma: 'Σ', Phi: 'Φ', Omega: 'Ω',
  };
  const TEX_OPERATORS = {
    cdot: '·', times: '×', div: '÷', pm: '±', le: '≤', leq: '≤', ge: '≥', geq: '≥', ne: '≠', neq: '≠',
    approx: '≈', equiv: '≡', to: '→', rightarrow: '→', leftarrow: '←', Rightarrow: '⇒', infty: '∞',
    ll: '≪', gg: '≫', land: '∧', lor: '∨', lnot: '¬', oplus: '⊕', lfloor: '⌊', rfloor: '⌋',
    lceil: '⌈', rceil: '⌉', langle: '⟨', rangle: '⟩', ldots: '…', cdots: '⋯', sum: '∑', prod: '∏',
    mid: '∣', in: '∈', notin: '∉', subset: '⊂', cup: '∪', cap: '∩',
  };
  const TEX_FONT_COMMANDS = {
    mathrm: 'normal', operatorname: 'normal', textrm: 'normal', mathit: 'italic', mathbf: 'bold', mathtt: 'monospace',
  };

  function texToMathML(tex, displayMode) {
    let position = 0;
    const skipWhitespace = () => { while (/\s/.test(tex[position] || '')) position++; };

    // a {group} or a single atom
    function readArgument() {
      skipWhitespace();
      if (tex[position] !== '{') return readAtom();
      position++;
      const items = readSequence('}');
      position++;
      return items.length === 1 ? items[0] : `<mrow>${items.join('')}</mrow>`;
    }

    // the raw text of a {…} argument, e.g. for \mathrm{malc.ix}
    function readBracedText() {
      skipWhitespace();
      if (tex[position] !== '{') return tex[position++] || '';
      const start = position + 1;
      let depth = 0;
      for (; position < tex.length; position++) {
        if (tex[position] === '{') depth++;
        else if (tex[position] === '}' && --depth === 0) break;
      }
      return tex.slice(start, position++);
    }

    function readCommand() {
      const name = tex.slice(position + 1).match(/^([a-zA-Z]+|.)/)?.[1] || '';
      position += 1 + name.length;
      if (TEX_FONT_COMMANDS[name]) return `<mi mathvariant="${TEX_FONT_COMMANDS[name]}">${escapeHtml(readBracedText())}</mi>`;
      if (name === 'text') return `<mtext>${escapeHtml(readBracedText())}</mtext>`;
      if (name === 'frac') return `<mfrac>${readArgument()}${readArgument()}</mfrac>`;
      if (name === 'sqrt') return `<msqrt>${readArgument()}</msqrt>`;
      if (name === 'left' || name === 'right') {
        skipWhitespace();
        return tex[position] === '\\' ? readAtom() : `<mo>${escapeHtml(tex[position++])}</mo>`;
      }
      if ([',', ';', ' ', 'quad'].includes(name)) return `<mspace width="${name === 'quad' ? '1em' : '0.25em'}"/>`;
      if (TEX_IDENTIFIERS[name]) return `<mi>${TEX_IDENTIFIERS[name]}</mi>`;
      if (TEX_OPERATORS[name]) return `<mo>${TEX_OPERATORS[name]}</mo>`;
      if (name.length === 1) return `<mo>${escapeHtml(name)}</mo>`;
      return `<mi mathvariant="normal">${escapeHtml(name)}</mi>`;
    }

    function readAtom() {
      skipWhitespace();
      const char = tex[position];
      if (char === undefined) return '';
      if (char === '\\') return readCommand();
      if (char === '{') return readArgument();
      if (/[0-9.]/.test(char)) {
        const number = tex.slice(position).match(/^[0-9]*\.?[0-9]+|^[0-9]+/)[0];
        position += number.length;
        return `<mn>${number}</mn>`;
      }
      position++;
      if (/[a-zA-Z]/.test(char)) return `<mi>${char}</mi>`;
      const operator = { '-': '−', '*': '∗' }[char] || char;
      return `<mo>${escapeHtml(operator)}</mo>`;
    }

    function readSequence(stopChar) {
      const items = [];
      while (position < tex.length && tex[position] !== stopChar) {
        skipWhitespace();
        if (position >= tex.length || tex[position] === stopChar) break;
        if (tex[position] !== '^' && tex[position] !== '_') { items.push(readAtom()); continue; }

        // sub- and superscripts attach to the previous item
        const base = items.pop() || '<mrow></mrow>';
        let subscript = null;
        let superscript = null;
        while (tex[position] === '^' || tex[position] === '_') {
          const kind = tex[position++];
          if (kind === '^') superscript = readArgument(); else subscript = readArgument();
          skipWhitespace();
        }
        if (subscript && superscript) items.push(`<msubsup>${base}${subscript}${superscript}</msubsup>`);
        else if (superscript) items.push(`<msup>${base}${superscript}</msup>`);
        else items.push(`<msub>${base}${subscript}</msub>`);
      }
      return items;
    }

    const body = readSequence(undefined).join('');
    return `<math${displayMode ? ' display="block"' : ''}><mrow>${body}</mrow></math>`;
  }

  /* ------------------------------------------------------------------ rendering */

  // `insideDivs` records the names of enclosing fenced divs, e.g. { encoding: true }
  function renderBlocks(blocks, context, insideDivs = {}) {
    return blocks.map((block) => renderBlock(block, context, insideDivs)).join('\n');
  }

  function renderBlock(block, context, insideDivs) {
    switch (block.type) {
      case 'paragraph': return `<p>${renderInline(block.text, context)}</p>`;
      case 'heading': return renderHeading(block, context);
      case 'thematicBreak': return '<hr>';
      case 'code': {
        const languageClass = block.language ? ` class="language-${escapeHtml(block.language)}"` : '';
        return `<pre><code${languageClass}>${escapeHtml(block.text)}</code></pre>`;
      }
      case 'math': return `<div class="equation">${texToMathML(block.tex, true)}</div>`;
      case 'blockquote': return `<blockquote>${renderBlocks(block.children, context, insideDivs)}</blockquote>`;
      case 'list': return renderList(block, context, insideDivs);
      case 'table': return renderTable(block, context, insideDivs);
      case 'footnoteDefinition': return context.referenceEntry(block.key, renderBlocks(block.children, context, insideDivs), insideDivs);
      case 'div': return renderDiv(block, context, insideDivs);
      default: return '';
    }
  }

  function renderHeading({ level, text, attributes }, context) {
    const id = context.uniqueId(attributes.id || slugify(text.replace(/[*_`]/g, '')));
    const headingAttributes = { ...attributes, id };
    return `<h${level}${attributesToHtml(headingAttributes)}>${renderInline(text, context)}</h${level}>`;
  }

  function renderList({ ordered, start, items, loose }, context, insideDivs) {
    const tag = ordered ? 'ol' : 'ul';
    const startAttribute = ordered && start !== 1 ? ` start="${start}"` : '';
    const itemsHtml = items.map(({ children }) => {
      // tight lists render their paragraphs without <p>
      const content = children.map((child) => (!loose && child.type === 'paragraph'
        ? renderInline(child.text, context)
        : renderBlock(child, context, insideDivs)));
      return `<li>${content.join('\n')}</li>`;
    }).join('\n');
    return `<${tag}${startAttribute}>\n${itemsHtml}\n</${tag}>`;
  }

  function renderDiv(block, context, insideDivs) {
    const name = block.attributes.classes[0] || '';
    const childDivs = { ...insideDivs, [name]: true };
    const content = () => renderBlocks(block.children, context, childDivs);

    if (name === 'isa' || name === 'imp') return `<section${attributesToHtml(block.attributes)}>\n${content()}\n</section>`;
    if (name === 'figure') return renderFigure(block, context, childDivs);
    if (name === 'legend') return `<aside${attributesToHtml(block.attributes)}>\n${content()}\n</aside>`;
    return `<div${attributesToHtml(block.attributes)}>\n${content()}\n</div>`;
  }

  /** Paragraphs holding only images become a row of images; other paragraphs become the caption. */
  function renderFigure(block, context, insideDivs) {
    const parts = block.children.map((child) => {
      if (child.type !== 'paragraph') return renderBlock(child, context, insideDivs);
      const html = renderInline(child.text, context);
      const images = html.match(/<img\b[^>]*>/g) || [];
      const onlyImages = images.length > 0 && html.replace(/<img\b[^>]*>|<br>|\s/g, '') === '';
      if (!onlyImages) return `<figcaption>${html}</figcaption>`;

      const items = images.map((image) => {
        const title = image.match(/\btitle="([^"]*)"/);
        const subcaption = title ? `<span class="subcaption">${title[1]}</span>` : '';
        return `<div class="fig-item">${image.replace(/\stitle="[^"]*"/, '')}${subcaption}</div>`;
      });
      return `<div class="fig-row">${items.join('')}</div>`;
    });
    const figureAttributes = { ...block.attributes, classes: block.attributes.classes.slice(1) };
    return `<figure${attributesToHtml(figureAttributes)}>\n${parts.join('\n')}\n</figure>`;
  }

  /* --- tables */

  function renderTable(table, context, insideDivs) {
    const columnCount = table.alignments.length;
    const rows = [...table.headerRows, ...table.bodyRows].map((cells) => {
      const row = cells.slice(0, columnCount);
      while (row.length < columnCount) row.push(' ');
      return row;
    });
    const grid = resolveCellSpans(rows);
    const headerRowCount = table.headerRows.length;
    const renderRow = (row, cellTag) => `<tr>${row.map((cell, column) => renderTableCell(cell, column, cellTag, table, context, insideDivs)).join('')}</tr>`;
    const header = grid.slice(0, headerRowCount).map((row) => renderRow(row, 'th')).join('\n');
    const body = grid.slice(headerRowCount).map((row) => renderRow(row, 'td')).join('\n');
    return `<div class="table-wrap"><table>\n<thead>\n${header}\n</thead>\n<tbody>\n${body}\n</tbody>\n</table></div>`;
  }

  /** Turns `||` (merge left) and `^^` (merge up) into colspan / rowspan on the owning cell. */
  function resolveCellSpans(rows) {
    const grid = rows.map((row) => row.map((raw) => ({
      raw, text: raw.trim(), colspan: 1, rowspan: 1, merged: false, owner: null,
    })));
    grid.forEach((row, rowIndex) => row.forEach((cell, column) => {
      let owner = null;
      if (cell.raw === '' && column > 0) {
        const left = row[column - 1];
        owner = left.owner || left;
        owner.colspan++;
      } else if (cell.text === '^^' && rowIndex > 0) {
        const above = grid[rowIndex - 1][column];
        owner = above.owner || above;
        owner.rowspan++;
      }
      if (owner) { cell.merged = true; cell.owner = owner; }
    }));
    return grid;
  }

  function renderTableCell(cell, column, cellTag, table, context, insideDivs) {
    if (cell.merged) return '';
    let attributes = '';
    if (cell.colspan > 1) attributes += ` colspan="${cell.colspan}"`;
    if (cell.rowspan > 1) attributes += ` rowspan="${cell.rowspan}"`;
    const alignment = table.alignments[column];
    if (alignment && cell.colspan === 1) attributes += ` style="text-align:${alignment}"`;

    // bit-field headers: "31:25" shows 31 at the left edge and 25 at the right edge
    const isBitHeader = insideDivs.encoding && cellTag === 'th';
    const bitRange = cell.text.match(/^(\d+)\s*:\s*(\d+)$/);
    let content;
    if (isBitHeader && bitRange) {
      content = `<span class="bits"><span>${bitRange[1]}</span><span>${bitRange[2]}</span></span>`;
      attributes += ' class="bitrange"';
    } else if (isBitHeader && /^\d+$/.test(cell.text)) {
      content = cell.text;
      attributes += ' class="bitrange"';
    } else {
      content = renderInline(cell.text, context);
      if (cell.text === '✔' || cell.text === '✓') attributes += ' class="yes"';
      else if (cell.text === '✖' || cell.text === '✗') attributes += ' class="no"';
    }
    return `<${cellTag}${attributes}>${content}</${cellTag}>`;
  }

  /* ------------------------------------------------------------------ public API */

  /** Per-document state: used ids, link definitions and citation numbers. */
  function createContext(baseUrl) {
    const usedIds = new Set();
    const citationNumbers = new Map();
    const referencesOutsideList = [];
    const numberFor = (key) => {
      if (!citationNumbers.has(key)) citationNumbers.set(key, citationNumbers.size + 1);
      return citationNumbers.get(key);
    };
    return {
      baseUrl,
      linkDefinitions: {},
      referencesOutsideList,
      uniqueId(id) {
        let unique = id;
        for (let n = 1; usedIds.has(unique); n++) unique = `${id}-${n}`;
        usedIds.add(unique);
        return unique;
      },
      citation(key) {
        const number = numberFor(key);
        return `<a class="cite" href="#${escapeHtml(key)}" data-note="${number}">[${number}]</a>`;
      },
      // entries inside `::: references` render in place, others are collected at the end
      referenceEntry(key, html, insideDivs) {
        const number = numberFor(key);
        const entry = `<div class="footnote" id="${escapeHtml(key)}"><span class="fn-label">[${number}]</span><div class="fn-body">${html}</div></div>`;
        if (insideDivs.references) return entry;
        referencesOutsideList.push(entry);
        return '';
      },
    };
  }

  /**
   * @param {string} source   Markdown text
   * @param {{baseUrl?: string}} options  URL of the Markdown file; relative links and images resolve against it
   * @returns {{meta: object, html: string, renderInline: (text: string) => string}}
   */
  function parse(source, { baseUrl = null } = {}) {
    const normalized = source.replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
    const { meta, body } = splitFrontMatter(normalized);
    const context = createContext(baseUrl);
    const blocks = parseBlocks(body.split('\n'), context);
    let html = renderBlocks(blocks, context);
    if (context.referencesOutsideList.length) {
      html += `\n<section class="footnotes"><hr>${context.referencesOutsideList.join('\n')}</section>`;
    }
    return { meta, html, renderInline: (text) => renderInline(String(text), context) };
  }

  return { parse, slugify };
})();
</script>
<script>
/* ==========================================================================
   Viewer: loads the Markdown, renders it, then adds what the original page
   had: chapter and figure numbers, a table of contents, the legend panel.
   ========================================================================== */
(() => {
  'use strict';

  const DEFAULT_MARKDOWN_FILE = 'risc-vio.md';
  // a heading counts as "being read" once it has scrolled above this line
  const READING_LINE_PX = 140;

  const page = {
    body: document.body,
    titleBlock: document.getElementById('titleblock'),
    tocPanel: document.getElementById('toc-panel'),
    tocList: document.getElementById('toc'),
    legend: document.getElementById('legend'),
    content: document.getElementById('doc'),
    fileInput: document.getElementById('file-input'),
  };

  // state of the current document
  let tocEntries = [];      // [{ heading, link }] in document order
  let currentEntry = null;  // the entry whose section is being read

  /* ------------------------------------------------------------------ startup */

  setUpSidePanels();
  setUpFileChoosing();
  setUpReadingPositionTracking();
  loadInitialDocument();

  async function loadInitialDocument() {
    const fileName = new URLSearchParams(location.search).get('src') || DEFAULT_MARKDOWN_FILE;

    if (location.protocol === 'file:') {
      showFilePrompt({
        title: 'Choose the Markdown file',
        explanation: `This page was opened straight from your disk. For security reasons, browsers don't let such pages read other files by themselves, so please pick <code>${escapeHtml(fileName)}</code> once.`,
        showServerHint: true,
      });
      return;
    }

    try {
      const response = await fetch(fileName, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`the server answered ${response.status}`);
      const markdown = await response.text();
      showDocument(markdown, new URL(fileName, location.href).href, fileName);
    } catch (error) {
      showFilePrompt({
        title: `Couldn't load ${fileName}`,
        explanation: `Loading it failed (${escapeHtml(error.message)}). You can choose the file yourself instead.`,
      });
    }
  }

  /* ------------------------------------------------------------------ rendering a document */

  function showDocument(markdown, baseUrl, fileName) {
    const { meta, html, renderInline } = Markdown.parse(markdown, { baseUrl });

    page.body.classList.remove('awaiting-file');
    document.documentElement.lang = meta.lang || 'en';
    document.title = [meta.title, meta.subtitle].filter(Boolean).join(' ') || fileName;

    renderTitleBlock(meta, renderInline);
    page.content.innerHTML = html;
    moveLegendIntoPanel();
    markWideTables();
    numberChapters();
    numberFiguresAndEquations();
    styleInternalLinks();
    buildTableOfContents();
    highlightCurrentSection();
    scrollToLinkedSection();
  }

  /** Title, version and authors come from the front matter. */
  function renderTitleBlock(meta, renderInline) {
    if (!meta.title) {
      page.titleBlock.hidden = true;
      return;
    }
    const titleParts = [
      meta.pretitle && `<span class="t-pre">${renderInline(meta.pretitle)}</span>`,
      `<span class="t-title">${renderInline(meta.title)}</span>`,
      meta.subtitle && `<span class="t-sub">${renderInline(meta.subtitle)}</span>`,
    ].filter(Boolean);

    let html = `<h1 class="doc-title">${titleParts.join('')}</h1>`;
    if (meta.version) html += `<p class="t-version">${renderInline(meta.version)}</p>`;
    if (Array.isArray(meta.authors) && meta.authors.length) {
      const authors = meta.authors.map((author) => {
        const person = typeof author === 'string' ? { name: author } : author;
        const lines = ['name', 'affiliation', 'location', 'email']
          .filter((field) => person[field])
          .map((field) => `<div class="a-${field}">${renderInline(person[field])}</div>`);
        return `<div class="author">${lines.join('')}</div>`;
      });
      html += `<div class="authors">${authors.join('')}</div>`;
    }
    page.titleBlock.innerHTML = html;
    page.titleBlock.hidden = false;
  }

  /** The `::: legend` block lives in the Markdown but is shown in its own panel. */
  function moveLegendIntoPanel() {
    const legendBlock = page.content.querySelector('aside.legend');
    page.legend.replaceChildren(...(legendBlock ? legendBlock.childNodes : []));
    legendBlock?.remove();
    page.body.classList.toggle('no-legend', !legendBlock);
  }

  /** Tables with many columns get smaller type and scroll sideways instead of squeezing cells. */
  function markWideTables() {
    for (const table of page.content.querySelectorAll('table')) {
      const lastRow = table.rows[table.rows.length - 1];
      if (lastRow && lastRow.cells.length >= 9) table.classList.add('many-cols');
    }
  }

  function numberChapters() {
    let chapter = 0;
    for (const heading of page.content.querySelectorAll('h1:not(.unnumbered)')) {
      chapter++;
      heading.dataset.num = chapter;
      heading.prepend(createSpan('secnum', `${chapter}.`));
    }
  }

  function numberFiguresAndEquations() {
    let figure = 0;
    for (const figureElement of page.content.querySelectorAll('figure')) {
      const caption = figureElement.querySelector(':scope > figcaption');
      if (!caption) continue; // uncaptioned figures stay unnumbered
      figure++;
      figureElement.dataset.num = figure;
      caption.prepend(createSpan('fignum', `Fig. ${figure}.`));
    }

    let equation = 0;
    for (const equationElement of page.content.querySelectorAll('.equation')) {
      equation++;
      equationElement.dataset.num = equation; // shown as "(n)" by CSS
      equationElement.id ||= `eq-${equation}`;
    }
  }

  /**
   * Links to sections get the original's [bracket] style. Links to figures and
   * equations keep their wording but show the current number ("Figure 2" → "Figure 7").
   * Links whose target is missing are marked so they are easy to spot.
   */
  function styleInternalLinks() {
    for (const link of page.content.querySelectorAll('a[href^="#"]:not(.cite)')) {
      const targetId = decodeURIComponent(link.getAttribute('href').slice(1));
      const target = targetId && document.getElementById(targetId);

      if (!target) {
        link.classList.add('xref', 'broken');
        link.title = `Link target #${targetId} not found`;
      } else if (target.dataset.num && (target.matches('figure') || target.matches('.equation'))) {
        link.classList.add('figref');
        if (!link.textContent.trim()) {
          link.textContent = target.matches('figure') ? `Fig. ${target.dataset.num}` : `(${target.dataset.num})`;
        } else {
          replaceFirstNumber(link, target.dataset.num);
        }
      } else {
        link.classList.add('xref');
      }
    }
  }

  function replaceFirstNumber(element, newNumber) {
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    for (let textNode = walker.nextNode(); textNode; textNode = walker.nextNode()) {
      if (/\d+/.test(textNode.data)) {
        textNode.data = textNode.data.replace(/\d+/, newNumber);
        return;
      }
    }
  }

  /* ------------------------------------------------------------------ table of contents */

  /** Chapters (h1) with their sections (h2), coloured like the section they belong to. */
  function buildTableOfContents() {
    page.tocList.replaceChildren();
    tocEntries = [];
    let currentChapterList = null;

    for (const heading of page.content.querySelectorAll('h1, h2')) {
      if (heading.closest('figure')) continue;
      const item = document.createElement('li');
      const category = heading.closest('section.isa, section.imp');
      if (category) item.classList.add(category.classList.contains('isa') ? 'isa' : 'imp');

      const link = document.createElement('a');
      link.href = `#${heading.id}`;
      const title = headingTitleHtml(heading);

      if (heading.tagName === 'H1') {
        item.classList.add('toc-h1');
        const number = createSpan('', heading.dataset.num ? `${heading.dataset.num}.` : '');
        const text = createSpan('', '');
        text.innerHTML = title;
        link.append(number, text);
        currentChapterList = document.createElement('ol');
        currentChapterList.className = 'toc-sub';
        item.append(link, currentChapterList);
        page.tocList.append(item);
      } else {
        item.classList.add('toc-h2');
        link.innerHTML = title;
        item.append(link);
        (currentChapterList || page.tocList).append(item);
      }
      tocEntries.push({ heading, link });
    }
    page.tocList.querySelectorAll('.toc-sub:empty').forEach((list) => list.remove());
  }

  function headingTitleHtml(heading) {
    const copy = heading.cloneNode(true);
    copy.querySelector('.secnum')?.remove();
    return copy.innerHTML.trim();
  }

  /* ------------------------------------------------------------------ reading position */

  function setUpReadingPositionTracking() {
    let updateScheduled = false;
    addEventListener('scroll', () => {
      if (updateScheduled) return;
      updateScheduled = true;
      requestAnimationFrame(() => {
        updateScheduled = false;
        highlightCurrentSection();
      });
    }, { passive: true });
  }

  /** Marks the section being read in the table of contents and keeps it visible there. */
  function highlightCurrentSection() {
    let entryBeingRead = null;
    for (const entry of tocEntries) {
      if (entry.heading.getBoundingClientRect().top >= READING_LINE_PX) break;
      entryBeingRead = entry;
    }
    if (entryBeingRead === currentEntry) return;

    currentEntry?.link.removeAttribute('aria-current');
    currentEntry = entryBeingRead;
    if (!currentEntry) return;
    currentEntry.link.setAttribute('aria-current', 'true');

    const tocIsSidebar = getComputedStyle(page.tocPanel).position === 'fixed';
    if (tocIsSidebar) keepVisibleInPanel(currentEntry.link, page.tocPanel);
  }

  function keepVisibleInPanel(element, panel) {
    const elementBox = element.getBoundingClientRect();
    const panelBox = panel.getBoundingClientRect();
    const margin = 40;
    if (elementBox.top < panelBox.top + margin || elementBox.bottom > panelBox.bottom - margin) {
      panel.scrollTop += elementBox.top - panelBox.top - panelBox.height / 3;
    }
  }

  /** The content is rendered after the page loaded, so the browser can't jump to #anchors itself. */
  function scrollToLinkedSection() {
    if (!location.hash) return;
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: 'instant', block: 'start' }));
  }

  /* ------------------------------------------------------------------ side panels (wide screens) */

  function setUpSidePanels() {
    for (const panel of ['toc', 'legend']) {
      document.getElementById(`${panel}-hide`).addEventListener('click', () => setPanelVisible(panel, false));
      document.getElementById(`${panel}-show`).addEventListener('click', () => setPanelVisible(panel, true));
      if (readSetting(panel) === 'hidden') page.body.classList.add(`${panel}-hidden`);
    }
  }

  function setPanelVisible(panel, visible) {
    page.body.classList.toggle(`${panel}-hidden`, !visible);
    saveSetting(panel, visible ? 'shown' : 'hidden');
    // keep keyboard focus on the button that brings the panel back (or hides it again)
    document.getElementById(visible ? `${panel}-hide` : `${panel}-show`).focus();
  }

  // localStorage can be unavailable (privacy settings, some file:// setups); then nothing is remembered
  function readSetting(name) {
    try { return localStorage.getItem(`md-viewer.${name}`); } catch { return null; }
  }
  function saveSetting(name, value) {
    try { localStorage.setItem(`md-viewer.${name}`, value); } catch { /* not remembered */ }
  }

  /* ------------------------------------------------------------------ choosing a file */

  function showFilePrompt({ title, explanation, showServerHint = false }) {
    page.body.classList.add('awaiting-file');
    page.titleBlock.hidden = true;
    page.tocList.replaceChildren();
    tocEntries = [];

    const serverHint = showServerHint
      ? `<p class="hint">To skip this step in future, serve the folder instead,
         e.g. run <code>python3 -m http.server</code> in it and open <code>http://localhost:8000/viewer.html</code>.</p>`
      : '';
    page.content.innerHTML = `
      <div class="file-prompt">
        <p class="prompt-title">${escapeHtml(title)}</p>
        <p>${explanation}</p>
        <button type="button" class="textbtn" data-action="choose-file">Choose Markdown file…</button>
        ${serverHint}
      </div>`;
  }

  function setUpFileChoosing() {
    document.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="choose-file"]')) page.fileInput.click();
    });
    page.fileInput.addEventListener('change', () => {
      const [file] = page.fileInput.files;
      if (file) openLocalFile(file);
      page.fileInput.value = ''; // allows choosing the same file again
    });
  }

  async function openLocalFile(file) {
    try {
      const markdown = await file.text();
      // images and links resolve relative to this page, so keep the .md next to it
      showDocument(markdown, location.href, file.name);
      if (!location.hash) scrollTo({ top: 0, behavior: 'instant' });
    } catch {
      showFilePrompt({
        title: `Couldn't read ${file.name}`,
        explanation: 'The file could not be read. Please choose it again or pick another Markdown file.',
      });
    }
  }

  /* ------------------------------------------------------------------ small helpers */

  function createSpan(className, text) {
    const span = document.createElement('span');
    if (className) span.className = className;
    span.textContent = text;
    return span;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
  }
})();
</script>
</body>
</html>
